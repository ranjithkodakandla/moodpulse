name: Build APK

on:
  push:
    branches: [ claude/moodpulse-android-app-frvnq9, main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          packages: >
            platforms;android-35
            build-tools;35.0.0
            ndk;26.3.11579264

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Rename APK
        id: apk
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          SHA=$(echo "${{ github.sha }}" | head -c 7)
          NAME="MoodPulse-debug-${DATE}-${SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "filename=$NAME" >> $GITHUB_OUTPUT
          echo "tag=build-${DATE}-${SHA}" >> $GITHUB_OUTPUT

      # Upload as GitHub Artifact (always available in the Actions run)
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.filename }}
          path: ${{ steps.apk.outputs.filename }}
          retention-days: 30

      # Also publish as a GitHub Release so the APK has a stable public download URL
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "MoodPulse APK — ${{ steps.apk.outputs.tag }}"
          body: |
            Debug APK built from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.filename }}
          draft: false
          prerelease: true
